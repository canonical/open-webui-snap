[pytest]
# Coarse backstop: fail any single test that runs longer than this instead of
# letting a hang (e.g. a stalled model inference not covered by a per-request
# timeout) block the whole CI job until GitHub cancels it hours later.
#
# This value MUST stay above the largest legitimate blocking wait, otherwise it
# would kill valid slow first-runs. pytest-timeout counts fixture setup against
# the test (func_only=False), and the session fixtures can legitimately block
# for up to owui.HEALTH_TIMEOUT while first-run model downloads happen; this
# leaves headroom above that.
#
# The primary guard against hangs is the per-request timeout= on each requests
# call in the tests; this is only the last-resort net.
timeout = 1800

# Use a dedicated timer thread so the timeout fires even while blocked inside a
# C-level socket read (requests). The alternative "signal" method only works on
# the main thread.
timeout_method = thread
