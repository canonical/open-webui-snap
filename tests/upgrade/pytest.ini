[pytest]
# Coarse backstop for the upgrade suite — see tests/smoke/pytest.ini for the
# full rationale. Fail any single test that runs longer than this instead of
# letting a hang block the CI job for hours.
#
# Must stay above the largest legitimate blocking wait. test_perform_upgrade
# runs a snap refresh and then waits up to owui.HEALTH_TIMEOUT (1200s) for the
# upgraded server to become healthy, so 1800s gives headroom while still
# bounding an infinite hang. Per-request timeout= on each requests call remains
# the primary guard.
timeout = 1800

# Dedicated timer thread so the timeout fires even while blocked inside a
# C-level socket read (requests). "signal" only works on the main thread.
timeout_method = thread
