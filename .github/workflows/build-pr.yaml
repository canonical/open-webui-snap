name: Build PR when labeled

on:
  pull_request:
    types: [ labeled ]

permissions:
  pull-requests: write

jobs:
  remove-label:
    uses: canonical/inference-snaps-dev/.github/workflows/remove-label.yaml@v2
    with:
      label: ${{ vars.PR_BUILD_TRIGGER_LABEL }}

  build-and-publish:
    needs: remove-label
    if: github.event.label.name == vars.PR_BUILD_TRIGGER_LABEL
    uses: canonical/inference-snaps-dev/.github/workflows/build-publish-snap.yaml@v2
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [ self-hosted, amd64, noble, medium ]
          - [ self-hosted, arm64, noble, medium ]
    with:
      runner: "${{ toJSON(matrix.runner) }}"
      # Publish to a channel with the pr number in it
      publish-channel: latest/edge/pr-${{ github.event.pull_request.number }} # Add track if needed, e.g., 24/latest/edge/pr-#
    secrets:
      store-credentials: ${{ secrets.STORE_LOGIN }}

  smoke-test:
    needs: build-and-publish
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [ self-hosted, amd64, noble, medium ]
          - [ self-hosted, arm64, noble, medium ]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python Venv
        run: |
          sudo apt-get install -y python3-venv

      - name: Run smoke tests
        run: ./tests/run-smoke-tests.sh --channel latest/edge/pr-${{ github.event.pull_request.number }}

