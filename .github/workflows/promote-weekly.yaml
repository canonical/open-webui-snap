# This workflow promotes the snap through the channels on a weekly schedule.
#
# The workflow requires a STORE_LOGIN_PROMOTE secret that can promote snaps to the candidate and stable channels.

name: Weekly promotion

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh/Install snapd
        run: sudo snap refresh snapd || sudo snap install snapd

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      # Closed channels are absent from the channel map, so a channel is only
      # promotable when it lists a revision for every architecture in the track.
      - name: Enforce published revisions for all architectures
        id: check
        run: |
          info="$(curl -fsSL -H 'Snap-Device-Series: 16' https://api.snapcraft.io/v2/snaps/info/open-webui)"

          arches() {
            jq -r --arg risk "$1" \
              '[."channel-map"[]
                | select(.channel.track == "latest" and ($risk == "" or .channel.risk == $risk))
                | .channel.architecture] | unique | join(" ")' <<< "$info"
          }

          all="$(arches "")"
          if [ -z "$all" ]; then
            echo "No architectures found for track latest." >&2
            exit 1
          fi
          echo "Architectures in latest: $all"

          get_state() {
            channel="$1"
            published="$(arches "$channel")"

            if [ "$published" = "$all" ]; then
              state=published
            else
              state=incomplete
            fi

            echo "${channel}=$state" >> "$GITHUB_OUTPUT"
            echo "latest/$channel is $state (published for: ${published:-none})."
          }

          get_state candidate
          get_state beta

      - name: Promote latest/candidate to latest/stable
        if: steps.check.outputs.candidate == 'published'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN_PROMOTE }}
        run: |
          snapcraft promote open-webui --yes \
            --from-channel latest/candidate \
            --to-channel latest/stable

      - name: Promote latest/beta to latest/candidate
        if: steps.check.outputs.beta == 'published'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN_PROMOTE }}
        run: |
          snapcraft promote open-webui --yes \
            --from-channel latest/beta \
            --to-channel latest/candidate
