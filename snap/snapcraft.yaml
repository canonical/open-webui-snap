name: open-webui

icon: logo.png
summary: Open WebUI is a user-friendly AI Interface (Supports Ollama, OpenAI API, ...)
description: |
  Open WebUI is an extensible, feature-rich, and user-friendly self-hosted AI platform designed to operate entirely offline. 
  It supports various LLM runners like Ollama and OpenAI-compatible APIs, with built-in inference engine for RAG, making it a powerful AI deployment solution.

# license: unset # there is a history of license changes

base: core24
grade: stable
confinement: strict

adopt-info: backend

# Faster compression to speed up build
compression: lzo

platforms:
  amd64:
  arm64:

parts:
  local:
    plugin: dump
    source: ./scripts
    organize:
      info.sh: bin/info.sh
      run-server.sh: bin/run-server.sh
      open-webui.desktop: bin/open-webui.desktop

#  frontend:
#    plugin: nil
#    source: &owui-source https://github.com/open-webui/open-webui.git
#    source-type: git
#    source-tag: &owui-tag v0.8.5
#    override-pull: |
#      craftctl default
#      last_committed_tag="$(git describe --tags --abbrev=0)"
#      last_committed_tag_ver="$(echo ${last_committed_tag} | sed 's/v//')"
#      craftctl set version="$(git describe --tags | sed 's/v//')"
#    build-snaps:
#      - node/20/stable
#    build-environment:
#      - NODE_OPTIONS: "--max-old-space-size=4096" # prevent OOM errors during build
#    override-build: |
#      craftctl default
#      npm ci --force
#      npm run build
#      cp -r build $CRAFT_PART_INSTALL/build
    

  backend:
    plugin: python
    source: https://github.com/open-webui/open-webui.git
    source-type: git
    source-tag: v0.8.5
    override-pull: |
      craftctl default
      last_committed_tag="$(git describe --tags --abbrev=0)"
      last_committed_tag_ver="$(echo ${last_committed_tag} | sed 's/v//')"
      craftctl set version="$(git describe --tags | sed 's/v//')"
    build-packages:
      - python3-minimal
      - python3-venv
      - python3-dev
      - python3-pip
      - git
    build-snaps:
      - node/20/stable
    build-environment:
      - NODE_OPTIONS: "--max-old-space-size=4096" # prevent OOM errors during build
    stage-packages:
      - python3-minimal
    override-build: |
      # The python plugin fails if we run the build while files from a previous build exist in the install dir
      rm -rf $CRAFT_PART_INSTALL/*
      
      # python plugin uses pyproject.toml in root of repo to install dependencies
      craftctl default
      
      # Remove GPU-specific packages
      pip uninstall torch triton \
        nvidia-cublas-cu12 nvidia-cuda-cupti-cu12 nvidia-cuda-nvrtc-cu12 \
        nvidia-cuda-runtime-cu12 nvidia-cudnn-cu12 nvidia-cufft-cu12 \
        nvidia-curand-cu12 nvidia-cusolver-cu12 nvidia-cusparse-cu12 \
        nvidia-nccl-cu12 nvidia-nvjitlink-cu12 nvidia-nvtx-cu12 -y
      # Install CPU-only alternatives
      # pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu


apps:
  open-webui:
    command: bin/info.sh
    desktop: bin/open-webui.desktop

  server:
    command: bin/run-server.sh
    daemon: simple
    install-mode: enable
    restart-condition: on-failure
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - opengl
    environment:
      ENV: prod
      DATA_DIR: $SNAP_COMMON/data
      STATIC_DIR: $SNAP_DATA/static
