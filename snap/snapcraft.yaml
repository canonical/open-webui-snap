name: open-webui

summary: Open WebUI is a user-friendly AI Interface (Supports Ollama, OpenAI API, ...)
description: |
  Open WebUI is an extensible, feature-rich, and user-friendly self-hosted AI platform designed to operate entirely offline. 
  It supports various LLM runners like Ollama and OpenAI-compatible APIs, with built-in inference engine for RAG, making it a powerful AI deployment solution.

# license: unset # there is a history of license changes

base: core24
grade: stable
confinement: strict

adopt-info: owui-pip

# Faster compression to speed up build
compression: lzo

platforms:
  amd64:
  arm64:

parts:
  local:
    plugin: dump
    source: ./scripts
    organize:
      info.sh: bin/info.sh
      run-server.sh: bin/run-server.sh

  owui-pip:
    plugin: python
    source: .
    build-packages:
      - python3-minimal
      - python3-venv
      - python3-dev
      - python3-pip
      - git
    stage-packages:
      - python3-minimal
    python-packages:
      - open-webui
    override-build: |
      craftctl default
      
      owui_pip_version="$(python3 -m pip show open-webui | grep Version: | awk '{print $2}')"
      snap_packaging_commit="$(git -C $SNAPCRAFT_PROJECT_DIR describe --always --dirty)"
      
      craftctl set version="$owui_pip_version+snap.$snap_packaging_commit"

apps:
  open-webui:
    command: bin/info.sh

  server:
    command: bin/run-server.sh
    daemon: simple
    install-mode: enable
    restart-condition: on-failure
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - opengl
    environment:
      ENV: prod
      DATA_DIR: $SNAP_COMMON/data
      STATIC_DIR: $SNAP_DATA/static
